services:
  web:
    build:
      context: .
      target: serve
      args:
        - BUILD_MODE=development
        - VITE_APP_API=${VITE_APP_API}
        - VITE_ADMIN_EMAIL=${VITE_ADMIN_EMAIL}
        - VITE_ADMIN_WHATSAPP=${VITE_ADMIN_WHATSAPP}
    image: ais-ui:latest
    container_name: ais-ui-web
    ports:
      - "8080:80"
    restart: unless-stopped
  
  # docker compose run --rm node npm install --legacy-peer-deps
  node:
    image: node:26-slim
    profiles: ["tools"]
    working_dir: /app
    user: node
    volumes:
      - .:/app
    environment:
      npm_config_update_notifier: "false"
    entrypoint: []
    command: ["sh"]