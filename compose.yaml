services:

# docker compose up --build app     
  app:
    build:
      context: .
      target: base
    container_name: react-19-ais-ui-dev
    user: node
    env_file:
      - .env
    volumes:
      - .:/app
      - node_modules_ais-ui:/app/node_modules
    command: ["npm", "run", "build", "--", "--mode", "development", "--minify", "false"]

# docker compose run --rm node npm install --legacy-peer-deps   
  node:
    image: node:26-slim
    profiles: 
      - tools
    working_dir: /app
    user: node
    volumes:
      - ./:app
    env_file:
      - .env
    entrypoint: []
    command: ["sh"]

# docker compose --profile tools up -d nginx-dist               
  nginx-dist:
    image: nginx:stable-alpine
    profiles: ["tools"]
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  node_modules_ais-ui:
    name: node_modules_ais-ui
    