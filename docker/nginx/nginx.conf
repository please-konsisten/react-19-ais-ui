server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aset hasil build Vite memakai hash di nama file -> aman di-cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback ke index.html (berguna bila nanti memakai client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
